name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

      - name: Check personal-data declarations and JSON leaks (RGPD)
        run: bin/pii-guard

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0

          # Clés de chiffrement Active Record (cf. config/initializers/
          # active_record_encryption.rb, utilisées par SlackWorkspace#bot_token).
          # En développement elles viennent de .env, qui n'est pas versionné —
          # d'où leur absence ici, qui mettait 44 tests en erreur.
          #
          # Ces valeurs sont VOLONTAIREMENT en clair et n'ont rien de secret :
          # la base de test est recréée à chaque run et ne contient aucune donnée
          # réelle, donc ces clés ne protègent rien. Y mettre les vraies clés (ou
          # la RAILS_MASTER_KEY) les exposerait à tout code exécuté par la CI, y
          # compris celui d'une pull request extérieure — beaucoup de risque pour
          # aucun bénéfice.
          # ⚠️ Ne jamais réutiliser ces valeurs ailleurs qu'en CI.
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ci_primary_key_not_a_secret_0001
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ci_deterministic_key_not_secret1
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ci_key_derivation_salt_not_sec01
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0

          # Mêmes clés jetables que le job `test` ci-dessus (voir le commentaire
          # détaillé qui s'y trouve). Les tests système ne touchent pas encore
          # d'attribut chiffré, mais les en priver ferait échouer le premier qui
          # le fera — pour une raison difficile à diagnostiquer.
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ci_primary_key_not_a_secret_0001
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ci_deterministic_key_not_secret1
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ci_key_derivation_salt_not_sec01
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
