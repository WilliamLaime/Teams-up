# Étend les listes du config par défaut au lieu de les remplacer
# (sans ceci, AllowedNames ci-dessous écraserait `as`, `at`, `by`, `id`…).
inherit_mode:
  merge:
    - AllowedNames

AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'script/**/*'
    - 'support/**/*'
    - 'tmp/**/*'
    - 'test/**/*'

Style/ConditionalAssignment:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/RedundantReturn:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/WordArray:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/SignalException:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Style/MissingRespondToMissing:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/LineLength:
  Max: 150
  # Ignore les commentaires, descriptions SEO et données de seed (contenus longs intentionnels)
  AllowedPatterns:
    - '\A\s*#'
    - 'description:'
    - 'desc:'
    - 'ref:'
Style/EmptyMethod:
  Enabled: false
Bundler/OrderedGems:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Style/SafeNavigationChainLength:
  Enabled: false
Lint/DuplicateBranch:
  Enabled: false
# Faux positif sur les constantes définies dans des modules privés
Lint/UselessConstantScoping:
  Enabled: false
# Préférence de style — parfois moins lisible avec le modifier form sur des lignes longues
Style/IfUnlessModifier:
  Enabled: false
# Guard clause optionnel — parfois le if explicite est plus lisible
Style/GuardClause:
  Enabled: false
# Metrics désactivés — trop de faux positifs sur du code Rails
Metrics/ParameterLists:
  Enabled: false
Metrics/BlockNesting:
  Enabled: false
# Non-local exit dans iterator — pattern parfois nécessaire dans les controllers Rails
Lint/NonLocalExitFromIterator:
  Enabled: false
# Préfixe has_/is_ intentionnel et lisible sur nos prédicats métier
# (ex: has_new_members_for_captain?) — renommer casserait les appelants pour rien
Naming/PredicatePrefix:
  Enabled: false
# Constantes définies dans un bloc de tâche rake — pattern courant et lisible ici
Lint/ConstantDefinitionInBlock:
  Enabled: false
# Numéros dans les identifiants (ex: sport_1) — tolérés dans les scripts de seed
Naming/VariableNumber:
  Enabled: false
# Deux noms courts s'ajoutent aux `id`/`db`/`io` déjà tolérés par défaut :
#   `ts` — nom du champ dans l'API Slack elle-même (horodatage identifiant un message) ;
#          le renommer désaccorderait notre signature de la documentation Slack ;
#   `tu` — abréviation de TournamentUser, employée partout dans le projet.
# Le cop reste actif pour tout le reste : c'est une exception nommée, pas une désactivation.
Naming/MethodParameterName:
  AllowedNames:
    - ts
    - tu
