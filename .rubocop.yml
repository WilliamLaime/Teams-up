AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'script/**/*'
    - 'support/**/*'
    - 'tmp/**/*'
    - 'test/**/*'

Style/ConditionalAssignment:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/RedundantReturn:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/WordArray:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/SignalException:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Style/MissingRespondToMissing:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/LineLength:
  Max: 150
  # Ignore les commentaires, descriptions SEO et données de seed (contenus longs intentionnels)
  AllowedPatterns:
    - '\A\s*#'
    - 'description:'
    - 'desc:'
    - 'ref:'
Style/EmptyMethod:
  Enabled: false
Bundler/OrderedGems:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Style/SafeNavigationChainLength:
  Enabled: false
Lint/DuplicateBranch:
  Enabled: false
# Faux positif sur les constantes définies dans des modules privés
Lint/UselessConstantScoping:
  Enabled: false
# Préférence de style — parfois moins lisible avec le modifier form sur des lignes longues
Style/IfUnlessModifier:
  Enabled: false
# Guard clause optionnel — parfois le if explicite est plus lisible
Style/GuardClause:
  Enabled: false
# Metrics désactivés — trop de faux positifs sur du code Rails
Metrics/ParameterLists:
  Enabled: false
Metrics/BlockNesting:
  Enabled: false
# Non-local exit dans iterator — pattern parfois nécessaire dans les controllers Rails
Lint/NonLocalExitFromIterator:
  Enabled: false
